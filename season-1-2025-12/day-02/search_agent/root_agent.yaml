# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
name: search_agent
model: gemini-2.5-flash-lite  # free tier: Search grounding returns 429 on newer models
description: A research assistant that answers questions using Google Search.
instruction: |
  You are a helpful research assistant.
  Use the google_search tool for anything time-sensitive or factual you are not sure about.
  Answer concisely and cite the sources you used.
tools:
  - name: google_search
